version: "1"
projects:
- name: My project
  environments:
  - name: Production
    services:
    - type: web
      name: old-currency-marketplace
      runtime: node
      repo: https://github.com/charanroyal00/old-currency-marketplace
      branch: pranathi
      plan: free
      envVars:
      - key: DJANGO_SETTINGS_MODULE
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        sync: false
      - key: PYTHON_VERSION
        sync: false
      region: virginia
      buildCommand: pip install --upgrade pip && pip install -r requirements.txt &&
        python manage.py collectstatic --no-input && python manage.py migrate
      startCommand: gunicorn config.wsgi:application
      healthCheckPath: /api/products/
      autoDeployTrigger: commit
